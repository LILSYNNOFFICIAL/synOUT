name: Build and publish synOUT for GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synout-static-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Clean previous published bundle before Vite build
        run: |
          rm -rf public/index.html public/assets
      - name: Build app for branch-based GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Prepare static site files
        run: |
          test -f dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cp -R dist/. public/
          touch .nojekyll
      - name: Publish built app into public directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .nojekyll
          if git diff --cached --quiet; then
            echo "Published app is already up to date."
          else
            git commit -m "Publish synOUT GitHub Pages build [skip ci]"
            git push origin HEAD:main
          fi
